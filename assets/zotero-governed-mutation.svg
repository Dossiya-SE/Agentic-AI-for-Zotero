<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d"><title id="t">Agentic AI for Zotero governed mutation architecture</title><desc id="d">A left-to-right fail-closed workflow from full paper through scientific adjudication and canonical evidence to native geometry proof, validated mutation, readback, independent audit and idempotency.</desc><rect width="1400" height="360" fill="#fff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.h{font-size:28px;font-weight:800}.s{font-size:14px;fill:#5e6b78}.n{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#52606d;stroke-width:1.5}.gate{fill:#fff;stroke:#00BFFF;stroke-width:2}.arrow{fill:none;stroke:#2878cd;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2878cd"/></marker></defs><text x="50" y="52" class="h">Evidence → governed Zotero mutation</text><text x="50" y="78" class="s">Workflow geometry represents required sequence and validation gates; it does not represent evidence strength.</text>
