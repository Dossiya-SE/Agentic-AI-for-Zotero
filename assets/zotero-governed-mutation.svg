<g transform="translate(180 125)"><rect class="box" width="125" height="58" rx="5"/><text class="n" x="62" y="25" text-anchor="middle">Scientific</text><text class="n" x="62" y="43" text-anchor="middle">adjudication</text></g>
<g transform="translate(325 125)"><rect class="box" width="125" height="58" rx="5"/><text class="n" x="62" y="25" text-anchor="middle">Canonical</text><text class="n" x="62" y="43" text-anchor="middle">evidence</text></g>
<g transform="translate(470 125)"><rect class="box" width="135" height="58" rx="5"/><text class="n" x="67" y="25" text-anchor="middle">Role/context</text><text class="n" x="67" y="43" text-anchor="middle">separation</text></g>
